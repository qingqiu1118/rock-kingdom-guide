圣龙骑士是当前版本热门Boss，
拥有超高爆发伤害与龙系强化技能。
很多新手都会卡在这里。

<img src="https://game.gtimg.cn/images/roco/act/a20240119version/pic1.jpg">

<h2>
Boss机制
</h2>

<p>
Boss会在第三回合进入狂暴状态，
伤害大幅提升。
推荐提前使用减伤技能。
</p>

<div class="tip">

<b>推荐阵容：</b>

<br><br>

火花龙 + 水蓝蓝 + 酷拉

</div>

<h2>
打法思路
</h2>

<p>
开局先使用减伤技能，
第二回合叠加增益，
第三回合集中爆发输出。
</p>

<p>
如果队伍练度不足，
可以携带回复类宠物提高容错率。
</p>
