<div class="article">

<p>
火花龙是新手期最常见也最好用的火系宠物之一，
爆发高、入手早，适合推图与部分 Boss 战。
</p>

<h2>获取方式</h2>

<p>
创建角色时可选初始宠物，或在特定地图捕捉火系精灵进化获得。
</p>

<div class="tip">

<b>我一般会这样练：</b>

<br><br>

先提升特攻与速度，技能搭配「火花」「烈焰冲击」等火系输出技。

</div>

<h2>对战定位</h2>

<p>
适合作为队伍中的主力输出，配合水系宠物克制草系关卡；
面对高防 Boss 时可搭配减防或增益技能。
</p>
